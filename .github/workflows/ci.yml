name: checks

# The push / pull_request triggers are off at the moment: the account's GitHub
# Actions are blocked by an unresolved billing lock, so every run fails at
# startup and leaves a red cross on each push. This is one deliberate disable,
# not a gap — the same four steps are documented in the README and were run
# against the tree they shipped on. To restore, replace workflow_dispatch:
# below with:
#   push:
#     branches: [main]
#   pull_request:

on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check backend evaluation scripts
      # No DATABASE_URL here on purpose: the store's integration test skips and the
      # rest of the suite runs against the small FinQA fixture.
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node node_modules/typescript/bin/tsc --noEmit
        working-directory: frontend
      - run: node node_modules/vite/bin/vite.js build
        working-directory: frontend
