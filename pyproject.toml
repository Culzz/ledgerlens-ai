[project]
name = "ledgerlens-ai"
version = "0.1.0"
description = "Evidence-grounded financial intelligence: numerical reasoning over financial reports"
requires-python = ">=3.11,<3.13"
# A dependency here is something the code imports, not something planned. Anything
# the roadmap wants goes in an extra below, so `pip install -e .` never installs a
# library that nothing calls.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Pipeline components, added per milestone. Kept separate so Milestone 0-1
# stays a fast, dependency-light install.
extraction = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
]
retrieval = [
    "sentence-transformers>=3.0",
]
# The LLM adapter talks to providers over plain HTTP (httpx, already a core
# dependency) rather than through a vendor SDK, so there is nothing extra to
# install to use a real model.
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
# The tests live next to the code they cover, which means package discovery
# finds them too. They are not part of the distribution, and a top-level
# "tests" package installed into site-packages is a name nobody needs to own.
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
