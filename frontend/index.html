<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LedgerLens — answers computed from a financial report</title>
    <meta
      name="description"
      content="Ask a question about a financial report. The model writes a program, a calculation engine runs it against the report's own figures, and the answer arrives with the arithmetic and the rows behind it."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Two faces, self-hosted, latin subset. Preloaded because both are on
         screen at first paint; the mono face is left to load when a program
         actually renders. -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/newsreader-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
